name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run it made obsolete; main keeps
# every run. Strongback holds a couple of runner slots per repo, so the two
# matrix legs may run one after the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # sbk-small: no Docker needed. Tighten timeout to ~3x p95 after a few runs.
    runs-on: [self-hosted, sbk-small]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both ends of the `engines` range the package claims to support.
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          cache: false
      # Ephemeral runner: a dependency cache would only upload to GitHub on
      # every run, so it stays off explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
