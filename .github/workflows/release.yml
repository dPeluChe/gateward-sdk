name: release

# Publica al pushear un tag `vX.Y.Z`. La versión del tag debe coincidir con la
# de package.json — el job falla si no, antes de tocar npm.
on:
  push:
    tags: ["v*.*.*"]

# Un run por tag; nunca se cancela una publicación en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # sbk-small: sin Docker. El provenance OIDC no depende del runner.
    runs-on: [self-hosted, sbk-small]
    timeout-minutes: 15
    permissions:
      contents: read
      # Requerido para el provenance de npm (attestation firmada por OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          cache: false
      # Runner efímero: un cache solo subiría a GitHub en cada run; queda apagado.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Tag y package.json deben coincidir
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG" >&2
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
